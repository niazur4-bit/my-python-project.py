{% extends "base.html" %}
{% block title %}Password Reset Complete | {{ SITE_NAME }}{% endblock %}

{% block content %}
<section class="py-5 py-lg-6 bg-paper">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-5">
        <div class="card-form text-center">
          <span class="eyebrow">Client portal</span>
          <h2 class="mt-2 mb-3"><i class="bi bi-check-circle text-green"></i> Password Updated</h2>
          <p class="text-secondary">Your password has been changed successfully. You can now log in with your new password.</p>
          <a href="{% url 'accounts:login' %}" class="btn btn-navy w-100 mt-3">Log In</a>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
